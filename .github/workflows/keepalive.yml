# Keeps the free Supabase project awake. Free projects pause after about a week
# without activity, which takes co-op and cloud saves offline.
# A read every three days was NOT enough: the project still paused around 2026-10-23 and the game was
# offline until it was restored on 2026-10-28. Now it runs every day and writes a heartbeat row
# (public.keepalive_ping(), migration keepalive_heartbeat) as well as reading. Uses only the public
# (publishable) key, the same one the game ships with.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat and read the weekly world
        run: |
          KEY="sb_publishable_uRC4vHHdHUnrdsqV2cSajA_HWrPTmZK"
          URL="https://gitqmiwwakaejznucxqn.supabase.co"
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' \
            "$URL/rest/v1/rpc/keepalive_ping"
          echo
          curl --fail --silent --show-error --max-time 30 -H "apikey: $KEY" \
            "$URL/rest/v1/weekly_worlds?select=week_id&limit=1" > /dev/null
          echo "Supabase answered."
      - name: If this fails, the project is probably paused
        if: failure()
        run: echo "::error::Supabase did not answer. Open the hollow-roots project in the Supabase dashboard and click Restore."
