# Builds the 3D game and publishes it to GitHub Pages, so friends can play (and
# join the leaderboard) at https://manandi.github.io/god/.
#
# One-time: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/practical-babbage-tbonr1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Supabase's publishable key is built to ship in the browser bundle;
      # row-level security and the functions in supabase/schema.sql limit it.
      VITE_SUPABASE_URL: https://gitqmiwwakaejznucxqn.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_uRC4vHHdHUnrdsqV2cSajA_HWrPTmZK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: first-person-verdant/package-lock.json
      # The 3D game is the whole site (the 2D game was retired on 2026-10-01).
      - run: npm ci
        working-directory: first-person-verdant
      - run: npx vite build --base=./ --outDir ../dist --emptyOutDir
        working-directory: first-person-verdant
      # Old links (/god/verdant/, including ?lobby= codes) land on the game at /god/.
      - run: |
          mkdir -p dist/verdant
          cat > dist/verdant/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>The Hollow Roots</title>
          <script>location.replace('../' + location.search + location.hash);</script>
          <a href="../">The Hollow Roots has moved. Continue →</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
