<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Hollow Roots</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0b0f;
        overflow: hidden;
        height: 100%;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
      }
      .title-root {
        width: 900px;
        height: 500px;
        color: #e6f4e9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        position: relative;
        box-sizing: border-box;
      }
      .title-card {
        position: absolute;
        left: 0;
        top: 0;
        width: 590px;
        min-height: 452px;
        padding: 28px 32px;
        box-sizing: border-box;
        background: linear-gradient(145deg, rgba(5, 22, 16, .97), rgba(10, 38, 27, .92));
        border: 1px solid rgba(155, 213, 168, .45);
        box-shadow: 0 22px 70px rgba(0, 0, 0, .55), inset 0 0 45px rgba(93, 150, 96, .08);
        border-radius: 4px;
      }
      .title-menu { padding-top: 38px; }
      .eyebrow {
        margin: 0 0 8px;
        color: #c9d58c;
        font-size: 12px;
        letter-spacing: .22em;
        font-weight: 700;
      }
      .title-root h1, .title-root h2, .title-root h3, .title-root p { margin-top: 0; }
      .title-root h1 {
        margin-bottom: 12px;
        color: #eff6d2;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 45px;
        line-height: .94;
        letter-spacing: .035em;
        text-shadow: 0 3px 20px rgba(181, 218, 128, .2);
      }
      .title-root h2 {
        margin-bottom: 0;
        color: #eff6d2;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px;
        letter-spacing: .04em;
      }
      .title-root h3 {
        margin-bottom: 10px;
        color: #bcd1bf;
        font-size: 12px;
        letter-spacing: .16em;
      }
      .title-copy, .panel-copy {
        max-width: 490px;
        color: #b9c9bd;
        font-size: 14px;
        line-height: 1.55;
      }
      .stat-rune-row, .live-stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        margin: 20px 0;
      }
      .stat-rune-row span, .live-stats span {
        display: flex;
        min-width: 0;
        padding: 8px 3px;
        flex-direction: column;
        align-items: center;
        background: rgba(119, 170, 113, .1);
        border: 1px solid rgba(161, 205, 145, .22);
      }
      .stat-rune-row b, .live-stats b { color: #8faa93; font-size: 10px; letter-spacing: .12em; }
      .stat-rune-row strong, .live-stats strong { color: #eff4ca; font-size: 20px; }
      .title-actions { display: grid; gap: 8px; max-width: 390px; }
      .title-root button {
        border: 1px solid rgba(156, 205, 164, .42);
        background: rgba(15, 48, 35, .9);
        color: #dce9df;
        padding: 10px 14px;
        font: 700 12px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .08em;
        cursor: pointer;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }
      .title-root button:hover:not(:disabled), .title-root button:focus-visible {
        transform: translateY(-1px);
        border-color: #d7e9a8;
        background: rgba(35, 85, 57, .96);
        outline: none;
      }
      .title-root button.primary {
        color: #102117;
        background: linear-gradient(90deg, #a9d48d, #d8df8f);
        border-color: #eff4ca;
      }
      .title-root button.quiet { background: transparent; color: #849b8b; border-color: transparent; }
      .save-note { margin: 16px 0 0; color: #779080; font-size: 10px; letter-spacing: .06em; }
      .title-character {
        position: absolute;
        right: 12px;
        top: 40px;
        width: 250px;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #dbe7c0;
        text-align: center;
        text-shadow: 0 2px 6px #000;
        pointer-events: none;
      }
      .title-character canvas { width: 180px; height: 260px; filter: drop-shadow(0 18px 16px rgba(0,0,0,.55)); }
      .title-character strong { margin-top: -8px; font-size: 14px; letter-spacing: .12em; }
      .title-character span { margin-top: 7px; color: #9db29f; font-size: 10px; }
      .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .title-root button.back { padding: 7px 9px; background: transparent; color: #a9b9ad; }
      .profile-card { width: 900px; min-height: 500px; padding: 22px 28px; }
      .profile-card .panel-copy { margin: 8px 0 13px; font-size: 12px; max-width: 820px; }
      .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; }
      .profile-grid label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        background: rgba(1, 13, 9, .42);
        border: 1px solid rgba(137, 180, 142, .16);
        color: #d5e2d8;
        font-size: 12px;
      }
      .profile-grid label span { display: flex; flex-direction: column; line-height: 1.2; }
      .profile-grid small { margin-top: 3px; color: #70877a; font-size: 9px; }
      .profile-grid input {
        width: 58px;
        box-sizing: border-box;
        padding: 7px 5px;
        color: #eff6d2;
        background: #071710;
        border: 1px solid #476b50;
        font: 700 13px ui-monospace, monospace;
        text-align: center;
      }
      .profile-card .live-stats { width: 470px; margin: 13px auto 10px; }
      .profile-card .live-stats span { padding: 5px 3px; }
      .profile-card .live-stats strong { font-size: 16px; }
      .form-actions { display: flex; justify-content: center; }
      .form-actions button { min-width: 260px; }
      .customize-card { width: 600px; min-height: 500px; padding: 24px 28px; }
      .custom-section { margin-top: 20px; }
      .choice-row { display: flex; gap: 10px; }
      .title-root .swatch {
        width: 42px;
        height: 42px;
        padding: 0;
        background: var(--swatch);
        border: 4px solid #12291d;
        outline: 1px solid #608268;
      }
      .title-root .swatch.selected { outline: 3px solid #e7eaa4; transform: translateY(-2px); }
      .option-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .custom-option { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
      .custom-option strong { font-size: 12px; }
      .custom-option small { margin-top: 4px; color: #7f9687; font-size: 9px; letter-spacing: 0; }
      .custom-option.selected { border-color: #dfe7a1; box-shadow: inset 3px 0 #dfe7a1; }
      .custom-option.locked { opacity: .46; cursor: not-allowed; }
      .custom-preview { right: 20px; top: 55px; }
      @media (max-width: 760px), (max-height: 500px) {
        .title-root { transform: scale(.78); transform-origin: center; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
